name: Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run ruff check .
      - run: uv run python scripts/check_issue_templates.py
      - run: uv run python scripts/check_doc_paths.py
      - run: uv run pytest
      - run: uv build --wheel
      - name: Smoke the installed wheel (institution/0.2 quickstart and legacy demo)
        run: |
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo | tee demo.out
          grep -q "institution/0.2" demo.out
          grep -q "case stale_authority" demo.out
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo --legacy-v0alpha1 > /dev/null

  # Separate job so the required contexts `test (3.12)` and `test (3.13)` keep their names.
  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run ruff check .
      - run: uv run python scripts/check_issue_templates.py
      - run: uv run python scripts/check_doc_paths.py
      - run: uv run pytest
      - run: uv build --wheel
      - name: Smoke the installed wheel (institution/0.2 quickstart and legacy demo)
        run: |
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo | tee demo.out
          grep -q "institution/0.2" demo.out
          grep -q "case stale_authority" demo.out
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo --legacy-v0alpha1 > /dev/null
