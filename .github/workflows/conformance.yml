name: Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run ruff check .
      - run: uv run python scripts/check_issue_templates.py
      - run: uv run python scripts/check_doc_paths.py
      - run: uv run python scripts/check_release_notes.py
      - run: uv run pytest
      - run: uv build --wheel
      - name: Smoke the installed wheel (institution/0.2 quickstart and legacy demo)
        run: |
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo | tee demo.out
          grep -q "institution/0.2" demo.out
          grep -q "case stale_authority" demo.out
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo --legacy-v0alpha1 > /dev/null

  # Separate job so the required contexts `test (3.12)` and `test (3.13)` keep their names.
  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run ruff check .
      - run: uv run python scripts/check_issue_templates.py
      - run: uv run python scripts/check_doc_paths.py
      - run: uv run python scripts/check_release_notes.py
      - run: uv run pytest
      - run: uv build --wheel
      - name: Smoke the installed wheel (institution/0.2 quickstart and legacy demo)
        run: |
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo | tee demo.out
          grep -q "institution/0.2" demo.out
          grep -q "case stale_authority" demo.out
          uv run --isolated --with ./dist/*.whl sn87-provenonce demo --legacy-v0alpha1 > /dev/null

  guides:
    # Runs every command of every guide in an isolated clone (steps not marked network;
    # run without network access intended, hygiene and not a sandbox).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/render_status.py --check
      - name: Build pinned Valkey replay server
        run: |
          curl --fail --location https://github.com/valkey-io/valkey/archive/refs/tags/9.1.2.tar.gz --output "$RUNNER_TEMP/sn87-valkey.tar.gz"
          # shasum -a 256 exists on both Linux and macOS runners (sha256sum is absent on macOS).
          echo "19c23908e7d57e8d91ef85b41f5646307582f10f4f0fb999bbf89ed24ec9c983  $RUNNER_TEMP/sn87-valkey.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/sn87-valkey.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/valkey-9.1.2/src" valkey-server MALLOC=libc BUILD_TLS=no -j2
          echo "$RUNNER_TEMP/valkey-9.1.2/src" >> "$GITHUB_PATH"
      - run: valkey-server --version
      - run: uv run python scripts/run_guide.py docs/guides/*.md
        env:
          SN87_GUIDE_REQUIRE_VALKEY: "1"

  guides-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Build pinned Valkey replay server
        run: |
          curl --fail --location https://github.com/valkey-io/valkey/archive/refs/tags/9.1.2.tar.gz --output "$RUNNER_TEMP/sn87-valkey.tar.gz"
          # shasum -a 256 exists on both Linux and macOS runners (sha256sum is absent on macOS).
          echo "19c23908e7d57e8d91ef85b41f5646307582f10f4f0fb999bbf89ed24ec9c983  $RUNNER_TEMP/sn87-valkey.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/sn87-valkey.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/valkey-9.1.2/src" valkey-server MALLOC=libc BUILD_TLS=no -j2
          echo "$RUNNER_TEMP/valkey-9.1.2/src" >> "$GITHUB_PATH"
      - run: valkey-server --version
      - run: uv run python scripts/run_guide.py docs/guides/*.md
        env:
          SN87_GUIDE_REQUIRE_VALKEY: "1"

  guides-network:
    # The steps marked network read the public test node. Not a required check: an unreachable
    # node must not block a merge, so a failure here is reported and never fails the run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/run_guide.py --network docs/guides/*.md

  # The signed-endpoint tests (tests/transport) against a real Valkey server. The image is
  # pinned by digest (tag 9.1.2). Service containers run on Linux runners only, so this is its
  # own job. The test jobs build their own server and run these tests from PATH as well.
  transport:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SN87_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
      SN87_REQUIRE_TRANSPORT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest tests/transport -ra
